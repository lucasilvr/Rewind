services:
  postgres:
    image: postgres:17
    container_name: rewind-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: rewind
      POSTGRES_PASSWORD: rewind
      POSTGRES_DB: rewind

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: